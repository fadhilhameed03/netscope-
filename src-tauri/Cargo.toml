[package]
name = "netscope"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "netscope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
uuid = { version = "1.24.0", features = ["v4"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2.7.2"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.53.1", features = ["full"] }

# Native embedded browser: bypasses wry's multiwebview JS API (which places
# child webviews in a plain gtk::Box — no absolute positioning support, see
# native_browser.rs) by talking to GTK/WebKitGTK directly. Versions pinned
# to exactly match what tauri/wry already resolve internally (see Cargo.lock)
# so the widget types are interoperable.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
gdk = "0.18.2"
glib = "0.18.5"
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
